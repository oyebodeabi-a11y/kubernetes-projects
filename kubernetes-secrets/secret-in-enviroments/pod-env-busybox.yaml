apiVersion: v1
kind: Pod
metadata:
  name: busybox
spec:
  containers:
  - image: busybox
    name: busybox-container
    command: ["/bin/sh"]
    args: ["-c", "sleep 600"]
    env:
    - name: myusername
      valueFrom:
        secretKeyRef:
          name: secret-busybox
          key: abiuser
    - name: mypassword
      valueFrom:
        secretKeyRef:
          name: secret-busybox
          key: password      